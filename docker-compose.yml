services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: escape_house
      POSTGRES_USER: escape_house
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-escape-house}
    volumes:
      - escape-house-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escape_house -d escape_house"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://escape_house:${POSTGRES_PASSWORD:-local-escape-house}@db:5432/escape_house
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      QUESTION_AGENT_INTERVAL_MS: ${QUESTION_AGENT_INTERVAL_MS:-600000}
volumes:
  escape-house-db:
