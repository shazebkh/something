services:
  - type: web
    name: escape-house
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: escape-house-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: escape-house-db
    plan: free
    region: singapore
    databaseName: escape_house
    user: escape_house
