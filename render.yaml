services:
  - type: web
    name: escape-house
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: escape-house-postgres
          property: connectionString

databases:
  - name: escape-house-postgres
    plan: free
    region: singapore
    databaseName: escape_house_postgres
    user: escape_house_postgres_user
